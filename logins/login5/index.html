<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
    <script src="senha.js" defer></script>
    <title>Document</title>
</head>
<body>
    <img src="../../TelaLogin/Fundo 3.png" alt="" class="fundo">
    <div class="login">
        <div class="esq">
            <img src="../../TelaLogin/Senac branco.png" alt="" class="logo">
            <h1>Music Hall</h1>
        </div>
        <div class="dir">
            <form action="" class="formulario">
                <div class="grupo-input">
                    <label for="email">Login:</label>
                    <input type="email" required placeholder="Email ou Cpf" id="email">
                </div>
                <div class="grupo-input">
                    <label for="senha">Senha:</label>
                    <div class="input-senha">
                        <input type="password" id="senha" required minlength="8" placeholder="senha">
                        <button type="button" class="olho" onclick="mostrar_senha()">
                            <img src="../../TelaLogin/Eye.png" alt="mostrar senha">
                        </button>
                    </div>
                </div>
                <div class="rodape">
                    <div class="linha"></div>
                    <button type="submit" class="entrar">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
