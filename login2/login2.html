<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hall</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg">
        <div class="formulario">
            <div class="header">
                <div class="logo">
                    <img src="../TelaLogin/Senac azul.png" alt="Senac">
                </div>
                <h2>Music Hall</h2>
            </div>
            <form class="formulario-container">
                <div class="grupo-input">
                    <label for="login">Login</label>
                    <input type="text"id="login" placeholder="Senha ou CPF">
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha</label>
                    <div class="input-senha">
                        <input type="password" id="senha" placeholder="Senha">
                        <img src="../TelaLogin/Eye.png" alt="Mostrar senha" class="icone-olho">
                    </div>
                </div>
                    <button type="submit" class="entrar">Entrar</button>
            </form>
            <div class="rodape">
                <div class="linha"></div>
                <div class="esqueceu">
                    <h3>Esqueci a senha</h3>
                </div>
            </div>
        </div>
    </div>
   
</body>
</html>
