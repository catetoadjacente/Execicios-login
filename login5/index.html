<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <main class="d-flex justify-content-center align-items-center">
    
    <img src="../TelaLogin/Fundo 3.png"  class="fundo max-vw-100 vh-100" alt="">
        <div class="circulo um"></div>
        <div class="circulo dois"></div>
        <div class="circulo tres"></div>
        <div class="circulo quatro"></div>
     <div class="login d-flex flex-row">
        <div class="bola position-absolute"></div>
        <div class="esq d-flex flex-column justify-content-center align-items-center">  
            <img src="../TelaLogin/Senac branco.png" alt="" class="logo">
            <h3>Music Hall</h3>
        </div>
        <div class="dir d-flex flex-column align-items-center justify-content-center ">
             <form class="formulario d-flex flex-column justify-content-start" >
                <div class="mb-3">
                    <label for="Login">Login</label>
                    <input type="email" class="form-control" id="Login" placeholder="Email ou cpf">
                </div>
                <div class="mb-3">
                    <label for="senha">Senha</label>
                    <input type="password" class="form-control" id="Senha" placeholder="Senha">
                </div>
                <div class="rodape d-flex flex-column align-items-center">
                    <button type="submit" class="entrar btn btn-primary rounded-pill">Entrar</button>
                    <div class="linha"></div>
                    <a href="#" class="esqueci">Esqueci a senha</a>
                </div>
                
             </form>
        </div>
    </div>
    </main>
</body>
</html>
